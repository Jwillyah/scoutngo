<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScoutNGo Home Golden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { color: #FFD9A0; }
    .tile { position: relative; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -3px 6px rgba(0,0,0,0.22), 0 2px 0 rgba(0,0,0,0.28), 0 10px 18px -8px var(--m); }
    .tile::before { content: ""; position: absolute; left: 12%; right: 12%; top: 5%; height: 44%; border-radius: 40% 40% 50% 50%; background: linear-gradient(rgba(255,255,255,0.45), rgba(255,255,255,0)); }
    .tile svg { position: relative; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.25)); }
    .feat { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 9px; }
    .feat span { font-size: 10.5px; font-weight: 600; color: #3A1430; text-align: center; line-height: 1.35; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #05070A; color: #F4EEE6; font-family: 'IBM Plex Mono', monospace">

  <!-- sky: night up top, golden at the horizon -->
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 520px; background: linear-gradient(180deg, #161A4A 0%, #3A2A78 22%, #7A3B93 40%, #C2508A 56%, #EE7A5A 72%, #F7A94A 86%, #FFD27A 100%)"></div>
  <!-- the sun on the horizon -->
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 520px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; background: radial-gradient(circle, rgba(255,230,160,0.9) 0%, rgba(255,190,90,0.45) 22%, rgba(255,160,80,0) 60%)"></div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 520px; width: 92px; height: 46px; margin-left: -46px; margin-top: -46px; border-radius: 46px 46px 0 0; background: linear-gradient(#FFF6D8, #FFD27A)"></div>

  <!-- below the horizon: the chart -->
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 520px; bottom: 0; background-color: #0A1621; background-image: linear-gradient(rgba(255,214,140,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,214,140,0.06) 1px, transparent 1px); background-size: 39px 39px"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 520px; height: 90px; background: linear-gradient(rgba(255,190,110,0.35), rgba(255,190,110,0))"></div>
  <svg aria-hidden="true" viewBox="0 0 390 324" style="position: absolute; left: 0; top: 520px; width: 390px; height: 324px">
    <!-- coastline -->
    <path d="M0 214 C60 196 90 230 150 214 S260 176 300 196 S370 212 390 200" fill="none" stroke="rgba(255,214,140,0.30)" stroke-width="1.2"/>
    <!-- sun bearing from spot 1 back to the sun -->
    <path d="M118 178 L195 2" stroke="#FFD27A" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round"/>
    <!-- field of view cones -->
    <path d="M118 178 L58 112 L170 104 Z" fill="rgba(247,169,74,0.20)" stroke="#F7A94A" stroke-width="1.2"/>
    <path d="M286 120 L226 40 L330 52 Z" fill="rgba(193,80,138,0.20)" stroke="#E5559A" stroke-width="1.2"/>
  </svg>
  <div style="position: absolute; left: 106px; top: 686px; width: 24px; height: 24px; border-radius: 50%; background: #FFF6E8; color: #2A1A08; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(247,169,74,0.5)">1</div>
  <div style="position: absolute; left: 274px; top: 628px; width: 24px; height: 24px; border-radius: 50%; background: #FFF6E8; color: #2A1A08; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(229,85,154,0.5)">2</div>

  <!-- brand -->
  <div style="position: absolute; left: 24px; right: 24px; top: 70px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <div class="tile" style="width: 76px; height: 76px; border-radius: 23px; background: linear-gradient(150deg, #FFE58A 0%, #F68B2E 48%, #8D1F5A 100%); --m: #F68B2E">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 42px; height: 42px"><path d="M12 22s-7.2-6.1-7.2-12a7.2 7.2 0 0 1 14.4 0c0 5.9-7.2 12-7.2 12z" fill="#FFF"/><path d="M8.4 11.6a3.6 3.6 0 0 1 7.2 0z" fill="#F68B2E"/><rect x="7.6" y="12.4" width="8.8" height="1.4" rx="0.7" fill="#C2508A"/></svg>
    </div>
    <div style="margin-top: 20px; font-size: 34px; font-weight: 700; letter-spacing: -0.01em; color: #FFFFFF; text-shadow: 0 2px 18px rgba(40,10,60,0.45)">ScoutNGo</div>
    <div style="margin-top: 12px; font-size: 15px; line-height: 1.5; color: #FBEFF4; max-width: 300px; text-shadow: 0 1px 10px rgba(40,10,60,0.5)">Plan the shot before you get there. Where to stand, which lens, and when the light is right.</div>

    <div style="margin-top: 30px; width: 100%; display: flex; gap: 10px">
      <div class="feat">
        <div class="tile" style="width: 50px; height: 50px; border-radius: 15px; background: linear-gradient(150deg, #FFE58A 0%, #F5B021 50%, #A86A05 100%); --m: #F5B021"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 27px; height: 27px"><path d="M3 6.4L9 4v13.6L3 20z" fill="#FFF"/><path d="M9 4l6 2.4V20l-6-2.4z" fill="#FFF" fill-opacity="0.72"/><path d="M15 6.4L21 4v13.6L15 20z" fill="#FFF"/><circle cx="12" cy="11" r="1.8" fill="#A86A05"/></svg></div>
        <span>Where<br>to stand</span>
      </div>
      <div class="feat">
        <div class="tile" style="width: 50px; height: 50px; border-radius: 15px; background: linear-gradient(150deg, #FFB496 0%, #EE6B43 50%, #9A3518 100%); --m: #EE6B43"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 27px; height: 27px"><path d="M5 7.3h2.4L9 5h6l1.6 2.3H19a2.2 2.2 0 0 1 2.2 2.2v7.8a2.2 2.2 0 0 1-2.2 2.2H5a2.2 2.2 0 0 1-2.2-2.2V9.5A2.2 2.2 0 0 1 5 7.3z" fill="#FFF"/><circle cx="12" cy="13.3" r="4" fill="#9A3518"/><circle cx="12" cy="13.3" r="2.2" fill="#7DD3FC"/></svg></div>
        <span>Which<br>lens</span>
      </div>
      <div class="feat">
        <div class="tile" style="width: 50px; height: 50px; border-radius: 15px; background: linear-gradient(150deg, #EFB2F5 0%, #B952D2 50%, #5E1E79 100%); --m: #B952D2"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 27px; height: 27px"><path d="M6.5 16.5a5.5 5.5 0 0 1 11 0z" fill="#FFF"/><path d="M12 6.2v2.2M6.2 9.4l1.5 1.5M17.8 9.4l-1.5 1.5M3.8 14.2h1.9M18.3 14.2h1.9" stroke="#FFF" stroke-width="2" stroke-linecap="round"/><rect x="3" y="17.6" width="18" height="2.2" rx="1.1" fill="#FFF" fill-opacity="0.85"/></svg></div>
        <span>When the<br>light hits</span>
      </div>
      <div class="feat">
        <div class="tile" style="width: 50px; height: 50px; border-radius: 15px; background: linear-gradient(150deg, #A9BBFF 0%, #5270DF 50%, #1F2F86 100%); --m: #5270DF"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 27px; height: 27px"><path d="M12 13.4l-9-4.2 9-4.2 9 4.2z" fill="#FFF"/><path d="M4.6 12.2L12 15.6l7.4-3.4 1.6.8-9 4.2-9-4.2z" fill="#FFF" fill-opacity="0.78"/><path d="M4.6 15.8L12 19.2l7.4-3.4 1.6.8-9 4.2-9-4.2z" fill="#FFF" fill-opacity="0.55"/></svg></div>
        <span>Works<br>offline</span>
      </div>
    </div>
  </div>

  <!-- action -->
  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <a href="#map" class="tile" style="width: 100%; height: 58px; border-radius: 29px; background: linear-gradient(150deg, #FFE58A 0%, #F5B021 48%, #E2621B 100%); --m: #F5B021; text-decoration: none; color: #2A1606; font-size: 16px; font-weight: 700; letter-spacing: 0.02em">
      <span style="position: relative">Open the map</span>
    </a>
    <div style="font-size: 12px; color: #B9C0CC">Free &middot; open source &middot; no account &middot; <a href="#how" style="color: #FFE0B0">How it works</a></div>
  </div>
</div>

</x-dc>
