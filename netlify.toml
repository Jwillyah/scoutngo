# Netlify deployment for ScoutNGo.
#
# SECRETS ARE NOT IN THIS FILE AND MUST NOT BE. ANTHROPIC_API_KEY and the optional
# GOOGLE_MAPS_API_KEY are set in the Netlify UI, under Site configuration →
# Environment variables, so they live only in Netlify's own store and in your
# local .env, which is gitignored. This file is committed; anything written here
# is public the moment the repository is. See "Deploy your own" in README.md.

[build]
  # Typechecks first: `npm run build` is `tsc -b && vite build`, so a type error
  # fails the deploy rather than shipping.
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # The app needs Node 20 or newer; pinned so a change to Netlify's default build
  # image cannot quietly move it.
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"
